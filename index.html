<!DOCTYPE html>
<html>
<head>
    <title>OpenPBR viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style type="text/css">
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        #output {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 5px;
            width: 100%;
            height: 100%;
            color: #3d0404;
            font-family: monospace;
            pointer-events: none;
            white-space: pre;
        }
        #samples {
            position: absolute;
            bottom: 0;
            left: 12px;
            width: 100%;
            color: #edce06cd;
            opacity: 0.8;
            font-family: monospace;
            text-align: left;
            padding: 10px 0;
            text-shadow: 2px 2px 0px rgb(255, 255, 255)(255, 255, 255);
        }
        #info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: #51be5d;
            opacity: 0.75;
            font-family: monospace;
            text-align: center;
            padding: 10px 0;
        }
        #progress_overlay {
            display: block;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            z-index:9999;
            color:#fff;
            opacity: 1.0;
            overflow:hidden;
        }
        #shader-error {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            max-height: 50%;
            overflow-y: auto;
            background: rgba(20, 0, 0, 0.92);
            color: #ff6b6b;
            font-family: monospace;
            font-size: 12px;
            white-space: pre;
            padding: 12px 16px;
            box-sizing: border-box;
            z-index: 10000;
            border-bottom: 2px solid #ff2222;
        }
        #shader-error-close {
            position: sticky;
            top: 0;
            float: right;
            cursor: pointer;
            color: #fff;
            background: #550000;
            border: none;
            padding: 2px 8px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
  <script type="module" crossorigin src="/OpenPBR-viewer/assets/index-CJZIAEb3.js"></script>
</head>
<body>
	<div id="info">
		OpenPBR viewer
	</div>
    <div id="samples"></div>
    <div id="shader-error"><button id="shader-error-close" onclick="this.parentElement.style.display='none'">✕ fermer</button><span id="shader-error-content"></span></div>
    <div id="output">
        <div id="progress_overlay"></div>
    </div>
</body>
</html>
