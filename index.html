<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OpenPBR viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js",
            "three/addons/": "/node_modules/three/examples/jsm/",
            "three/examples/jsm/": "/node_modules/three/examples/jsm/",
            "three-mesh-bvh": "/node_modules/three-mesh-bvh/build/index.module.js",
            "lil-gui": "/node_modules/lil-gui/dist/lil-gui.esm.js",
            "progressbar.js": "/public/progressbar-esm.js"
        }
    }
    </script>
    <style type="text/css">
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        #output {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 5px;
            width: 100%;
            height: 100%;
            color: #3d0404;
            font-family: monospace;
            pointer-events: none;
            white-space: pre;
        }
        #samples {
            position: static;
            display: block;
            box-sizing: border-box;
            width: 100%;
            color: #c8d5d7;
            background: rgba(255, 255, 255, 0.035);
            font-family: monospace;
            text-align: left;
            padding: 8px 11px;
            border-bottom: 1px solid #3a4144;
        }
        #info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: #51be5d;
            opacity: 0.75;
            font-family: monospace;
            text-align: center;
            padding: 10px 0;
        }
        #progress_overlay {
            display: block;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            z-index:9999;
            color:#fff;
            opacity: 1.0;
            overflow:hidden;
            white-space: normal;
            text-align: center;
        }
        #progress_overlay .progressbar__label {
            width: 160px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }
        #progress_overlay.is-loading svg,
        .startup-spinner { animation: loading-spin 2s linear infinite; }
        .startup-spinner {
            box-sizing: border-box;
            width: 48px;
            height: 48px;
            margin: 35px auto 15px;
            border: 4px solid #334044;
            border-top-color: #ff8040;
            border-radius: 50%;
        }
        @keyframes loading-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            #progress_overlay.is-loading svg,
            .startup-spinner { animation: none; }
        }
        #shader-error {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            max-height: 50%;
            overflow-y: auto;
            background: rgba(20, 0, 0, 0.92);
            color: #ff6b6b;
            font-family: monospace;
            font-size: 12px;
            white-space: pre;
            padding: 12px 16px;
            box-sizing: border-box;
            z-index: 10000;
            border-bottom: 2px solid #ff2222;
        }
        #shader-error-close {
            position: sticky;
            top: 0;
            float: right;
            cursor: pointer;
            color: #fff;
            background: #550000;
            border: none;
            padding: 2px 8px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
	<div id="info">
		OpenPBR viewer
	</div>
    <div id="samples"></div>
    <div id="shader-error"><button id="shader-error-close" onclick="this.parentElement.style.display='none'">✕ fermer</button><span id="shader-error-content"></span></div>
    <div id="output">
        <div id="progress_overlay" role="status" aria-live="polite"><div class="startup-spinner" aria-hidden="true"></div>Chargement du viewer...</div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
