<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenPBR mobile raster test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="data:,">
    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js",
            "three/addons/": "/node_modules/three/examples/jsm/",
            "three/examples/jsm/": "/node_modules/three/examples/jsm/",
            "three-mesh-bvh": "/node_modules/three-mesh-bvh/build/index.module.js",
            "lil-gui": "/node_modules/lil-gui/dist/lil-gui.esm.js",
            "progressbar.js": "/public/progressbar-esm.js"
        }
    }
    </script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info,
        #samples,
        #output,
        #shader-error,
        .lil-gui {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="info"></div>
    <div id="samples"></div>
    <div id="shader-error"><span id="shader-error-content"></span></div>
    <div id="output"><div id="progress_overlay"></div></div>
    <script type="module">
        const testParams = new URLSearchParams({
            renderer_mode: 'Rasterizer MTLX',
            scene_name: 'standard-shader-ball',
            render_size: '256x256',
            max_samples: '1',
            paused: 'false',
            gpu: 'false'
        });
        history.replaceState(null, '', `${location.pathname}?${testParams}`);
        await import('./main.js');
    </script>
</body>
</html>
